<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>みどり台ハウジング｜賃貸・売買・管理　地域密着40年</title>
<meta name="description" content="みどり台ハウジングは、みどり台駅前の地域密着型不動産会社です。賃貸物件の検索、内見のご予約はこちらから。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=Noto+Serif+JP:wght@400;600&family=Jost:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--main:#2f6b4f;--main2:#3f8a66;--sky:#f2f6f3;--ink:#25292a;--muted:#6f7975;--line:#dfe6e2;--bg:#fff;--card:#fff;--accent:#e0812f;--foot:#1f3a2d}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Noto Sans JP","Hiragino Kaku Gothic ProN",Meiryo,sans-serif;font-size:15px;line-height:1.85;letter-spacing:.03em;color:var(--ink);background:var(--bg);-webkit-font-smoothing:antialiased;transition:background .8s,color .8s}
a{color:inherit;text-decoration:none}
.en{font-family:"Jost",sans-serif;letter-spacing:.1em;font-weight:500}
.inner{max-width:1060px;margin:0 auto;padding:0 18px}
.util{background:var(--foot);color:#d6e3db;font-size:11.5px}
.util .inner{display:flex;justify-content:space-between;align-items:center;height:30px;gap:10px}
.util .tick{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header.gh{background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
.gh .inner{display:flex;align-items:center;height:64px;gap:16px}
.logo{display:flex;align-items:center;gap:10px;flex-shrink:0}
.logo svg{width:34px;height:34px}
.logo b{font-size:18px;font-weight:700;letter-spacing:.06em;display:block;line-height:1.2;color:var(--main)}
.logo small{font-size:10px;color:var(--muted);display:block}
.gnav{display:flex;gap:20px;margin-left:auto;font-size:13.5px;font-weight:500}
.gnav a{padding:20px 0;border-bottom:2px solid transparent}
.gnav a.on,.gnav a:hover{border-color:var(--main2);color:var(--main2)}
.tel{background:var(--accent);color:#fff;font-size:12.5px;font-weight:700;padding:8px 14px;border-radius:4px;white-space:nowrap}
.hamb{display:none;margin-left:auto;background:none;border:none;width:40px;height:40px;cursor:pointer}
.hamb span{display:block;height:2px;background:var(--ink);margin:6px 8px}
.drawer{display:none;background:var(--card);border-bottom:1px solid var(--line)}
.drawer.open{display:block}
.drawer a{display:block;padding:13px 18px;border-top:1px solid var(--line);font-size:14px}
@media(max-width:900px){.gnav,.gh .tel{display:none}.hamb{display:block}}
main{min-height:60vh}
section{padding:46px 0}
section.alt{background:var(--sky)}
.sh{display:flex;align-items:flex-end;gap:12px;margin-bottom:20px;flex-wrap:wrap}
.sh .en{font-size:26px;color:var(--main);line-height:1}
.sh h2{font-size:14px;font-weight:500;color:var(--muted)}
.sh .more{margin-left:auto;font-size:13px;color:var(--main2);border-bottom:1px solid currentColor}
.pagehead{background:var(--main);color:#fff;padding:34px 0 28px}
.pagehead .en{font-size:12px;color:#bfe0cc}
.pagehead h1{font-size:23px;font-weight:500;letter-spacing:.06em}
.crumb{font-size:12px;color:var(--muted);padding:10px 0}
.crumb a{color:var(--main2)}
.lead{font-size:14.5px;margin-bottom:18px}
.note{font-size:12.5px;color:var(--muted)}
.btn{display:inline-block;border:1px solid var(--main);color:var(--main);padding:9px 20px;font-size:13.5px;border-radius:4px;background:none;cursor:pointer;font-family:inherit}
.btn.fill{background:var(--accent);border-color:var(--accent);color:#fff}
.ph{background:linear-gradient(160deg,#9fb5a8,#3a4c43);overflow:hidden;position:relative}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.hero{position:relative;height:min(52vh,400px);overflow:hidden;color:#fff}
.hero .ph{position:absolute;inset:0}
.hero .cover{position:absolute;inset:0;background:linear-gradient(90deg,rgba(15,35,25,.72),rgba(15,35,25,.1))}
.hero .copy{position:absolute;left:0;right:0;top:50%;transform:translateY(-50%)}
.hero h2{font-size:clamp(22px,4.4vw,34px);font-weight:700;line-height:1.45;letter-spacing:.06em}
.hero p{font-size:14px;margin-top:8px}
.search{background:var(--card);border:1px solid var(--line);margin-top:-30px;position:relative;z-index:2;padding:16px;display:grid;grid-template-columns:repeat(3,1fr) auto;gap:10px;box-shadow:0 8px 22px rgba(0,0,0,.06)}
.search select{font:inherit;font-size:14px;padding:9px;border:1px solid var(--line);background:var(--card);color:var(--ink)}
@media(max-width:700px){.search{grid-template-columns:1fr 1fr}}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:20px}
.card{background:var(--card);border:1px solid var(--line)}
.card .ph{aspect-ratio:4/3}
.card .tx{padding:12px 14px}
.card .rent{font-family:"Jost";font-size:22px;color:var(--accent);font-weight:600}
.card .rent small{font-size:12px;font-family:"Noto Sans JP";color:var(--muted);font-weight:400}
.card h3{font-size:15px;font-weight:700}
.card p{font-size:12.5px;color:var(--muted);line-height:1.7}
.tag{display:inline-block;font-size:11px;border:1px solid var(--main2);color:var(--main2);padding:0 6px;margin:2px 3px 0 0;line-height:18px}
.tag.o{border-color:var(--accent);color:var(--accent)}
.news{border-top:1px solid var(--line)}
.news li{list-style:none;border-bottom:1px solid var(--line);padding:13px 4px;display:grid;grid-template-columns:auto 1fr;gap:4px 16px;font-size:14.5px}
.news time{font-family:"Jost";font-size:13px;color:var(--muted)}
@media(max-width:640px){.news li{grid-template-columns:1fr}}
.voice{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px}
.voice div{background:var(--card);border:1px solid var(--line);padding:16px;font-size:14px}
.voice small{display:block;color:var(--muted);margin-top:8px;font-size:12px}
.dtable{width:100%;border-collapse:collapse;font-size:14px;margin-bottom:18px}
.dtable th,.dtable td{border:1px solid var(--line);padding:9px 12px;text-align:left;font-weight:400;vertical-align:top}
.dtable th{background:var(--sky);width:30%;font-weight:500}
h3.sub{font-size:16.5px;font-weight:700;border-left:4px solid var(--main2);padding-left:10px;margin:28px 0 12px}
.gallery{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px}
.gallery figure{margin:0}.gallery .ph{aspect-ratio:4/3}
.gallery figcaption{font-size:12px;color:var(--muted);margin-top:4px}
@media(max-width:640px){.gallery{grid-template-columns:1fr 1fr}}
.planwrap{border:1px solid var(--line);background:var(--card);overflow:hidden;position:relative}
.planwrap svg{display:block;width:100%;height:auto}
.planwrap .rot{display:none;position:absolute;right:0;top:0;bottom:0;width:45%;background:linear-gradient(90deg,rgba(255,255,255,0),var(--card) 40%);align-items:center;justify-content:flex-end;padding-right:14px;font-size:12px;color:var(--muted);text-align:right}
@media (orientation:portrait){.planwrap svg{width:190%}.planwrap .rot{display:flex}}
.post{border-bottom:1px solid var(--line);padding:20px 0}
.post time{font-family:"Jost";font-size:13px;color:var(--muted)}
.post h3{font-size:16.5px;font-weight:700;margin:2px 0 8px}
.post p{font-size:14.5px}
.post .by{font-size:12px;color:var(--muted);text-align:right;margin-top:6px}
.form{display:grid;gap:12px;max-width:560px}
.form label{font-size:13px;color:var(--main);display:block;margin-bottom:4px}
.form input,.form select{width:100%;font:inherit;font-size:15px;padding:10px 12px;border:1px solid var(--line);background:var(--card);color:var(--ink)}
.q{font-weight:700;margin-top:20px;padding-left:1.8em;text-indent:-1.8em}.q::before{content:"Q.";font-family:"Jost";color:var(--main2);margin-right:.6em}
.a{font-size:14px;padding:8px 0 16px 1.8em;text-indent:-1.8em;border-bottom:1px solid var(--line)}.a::before{content:"A.";font-family:"Jost";color:var(--accent);margin-right:.6em}
details.h2{margin-top:6px;font-size:13px}details.h2 summary{cursor:pointer;color:var(--main2)}
.staff{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px}
.staff div{border:1px solid var(--line);padding:14px;background:var(--card);font-size:13.5px}
.staff b{font-size:15px;display:block}
footer{background:var(--foot);color:#cbdad1;font-size:13px;padding:42px 0 20px}
.fcols{display:grid;grid-template-columns:1.4fr repeat(2,1fr);gap:22px}
.fcols h4{font-family:"Jost";font-size:12px;color:#fff;font-weight:500;margin-bottom:8px;letter-spacing:.14em}
.fcols a{display:block;line-height:2.3;opacity:.85}
.fbottom{border-top:1px solid rgba(255,255,255,.15);margin-top:28px;padding-top:14px;display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;font-size:11.5px;opacity:.75}
.fbottom button{background:none;border:none;color:inherit;font:inherit;text-decoration:underline;cursor:pointer}
@media(max-width:760px){.fcols{grid-template-columns:1fr 1fr}.fcols>div:first-child{grid-column:1/-1}}
/* ===== 夜 ===== */
body.night{--main:#8fb8a2;--main2:#8fb8a2;--sky:#0f1512;--ink:#cfd7d2;--muted:#76837c;--line:#1e2a24;--bg:#0a0f0c;--card:#0e1511;--accent:#b07040;--foot:#050806}
body.night .ph img{filter:brightness(.45) saturate(.5)}
body.night .pagehead{background:#101a15}
body.night .planwrap .rot{background:linear-gradient(90deg,rgba(0,0,0,0),var(--card) 40%)}
/* ===== 204 ===== */
.closet{position:relative;aspect-ratio:4/3;background:#000;overflow:hidden;cursor:pointer;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;touch-action:manipulation}
.closet svg{position:absolute;inset:0;width:100%;height:100%;filter:brightness(calc(.12 + var(--b,0)*1.1)) contrast(1.1)}
.closet .lbl{position:absolute;right:8px;bottom:6px;font-size:11px;color:#8a8a80;background:rgba(0,0,0,.5);padding:1px 6px}
.wall{border:1px solid var(--line);background:repeating-linear-gradient(0deg,var(--card) 0 18px,var(--sky) 18px 19px);height:120px;display:flex;align-items:center;justify-content:center;font-size:13px;color:var(--muted);cursor:pointer;user-select:none;-webkit-user-select:none;touch-action:manipulation}
.wallmsg{min-height:24px;font-size:14px;margin-top:8px;font-family:"Noto Serif JP",serif}
.inside{background:#060807;color:#cbd2cd;padding:26px 20px;font-family:"Noto Serif JP",serif;line-height:2}
.inside h2{font-weight:600;font-size:20px;letter-spacing:.14em;margin-bottom:10px;color:#dfe6e1}
.contract{background:#ece6d8;color:#2a2620;padding:18px;margin:16px 0;font-family:"Noto Serif JP",serif;font-size:14px}
.contract table{width:100%;border-collapse:collapse}.contract td,.contract th{border:1px solid #b9ae98;padding:6px 8px;text-align:left;font-weight:400}
.contract th{width:30%;background:#e2dac8}
.contract input{width:100%;font:inherit;font-size:16px;border:none;border-bottom:1px solid #8a7e66;background:transparent;color:#2a2620;padding:4px 2px}
.hanko{width:70px;height:70px;border-radius:50%;border:2px dashed #9a3a2a;color:#9a3a2a;display:flex;align-items:center;justify-content:center;margin:12px 0 0 auto;font-size:12px;position:relative;overflow:hidden;cursor:pointer;touch-action:none;user-select:none;-webkit-user-select:none}
.hanko i{position:absolute;left:0;right:0;bottom:0;height:0;background:rgba(154,58,42,.25)}
.hanko span{position:relative}
.msg{min-height:22px;font-size:13px;margin-top:8px;color:#c98a64}
#end{position:fixed;inset:0;background:#000;color:#dcd8cf;z-index:99;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;font-family:"Noto Serif JP",serif;text-align:center;overflow-y:auto}
#end p{opacity:0;transition:opacity 1.6s;margin:7px 0;font-size:15.5px;letter-spacing:.1em}
#end p.v{opacity:1}
#end button{margin:22px 4px 0;background:none;border:1px solid #4a4a44;color:#bbb;padding:8px 18px;font:inherit;opacity:0;transition:opacity 2s;cursor:pointer}
</style>
</head>

const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};

const after=n=>S.stage===9&&S.last===n;

const norm=s=>hira((s||"").trim().replace(/[\s　、。,.・「」]/g,""));
const esc=s=>(s||"").replace(/[<>&"']/g,"");
const nm=()=>S.name||"お名前のない方";

function bind204(){

  if(c){let t0=0,on=false,b=S.stage>=2?1:0;c.style.setProperty("--b",b);

    c.addEventListener("pointerdown",e=>{e.preventDefault();on=true;go()});

    <div class="hanko" id="hanko"><span>押印</span><i id="hbar"></i></div></div>
   <p style="font-size:12.5px;color:#7d8a83">押印すれば、契約は成立する。</p><div class="msg" id="kmsg"></div>`;
}
function bindInside(){
  const h=document.getElementById("hanko");if(!h)return;
  let t0=0,on=false;
  const go=()=>{if(!on)return;const p=Math.min(1,(Date.now()-t0)/1500);document.getElementById("hbar").style.height=p*100+"%";if(p>=1){on=false;sign(document.getElementById("kname").value);return}requestAnimationFrame(go)};
  h.addEventListener("pointerdown",e=>{e.preventDefault();on=true;t0=Date.now();go()});
  ["pointerup","pointerleave","pointercancel"].forEach(ev=>h.addEventListener(ev,()=>{if(on){on=false;document.getElementById("hbar").style.height=0}}));
  h.addEventListener("contextmenu",e=>e.preventDefault());
}
function sign(raw){
  const v=norm(raw),m=document.getElementById("kmsg");document.getElementById("hbar").style.height=0;
  if(!v){m.textContent="借主の欄が、空白のままだ。";return}
  if(/(しらはぎとめ|白萩とめ|白萩トメ)/.test(v)||v==="しらはぎとめ"){ending(3);return}
  if(/(さの|佐野)/.test(v)){m.textContent="「……ぼくは、もう、ここにいます」";return}
  const me=norm(S.name);
  if(me&&v===me){ending(1);return}
  ending(2,raw);
}

 ["2026.08.28","内見予約のふしぎ","最近、同じお名前のお客様から、毎日のように203号室の内見予約が入ります。いつも、当日にはいらっしゃらないのですが。{N}"],
 ["2026.08.10","メゾン白萩のこと","築38年の木造アパート。2階は201・202・203・205で、四は縁起が悪いからと、204は欠番なんだそうです。大家の白萩さんは「夜に来てくれたら、204もお見せできるのにねえ」と笑っていました。冗談、ですよね。"],
 ["2026.07.22","203号室、また退去","203号室の森田様が退去されました。前の井上様も、その前の高橋様も、一年もたずに。皆さん口をそろえて「となりの人が、やさしすぎる」とおっしゃいます。"],
 ["2026.07.01","大家さんのこと","メゾン白萩の大家、白萩さんは、毎朝2階の廊下を掃除されています。会うといつも「203、早く埋まるといいわね」と。"],
];
function vBlog(){
  const ps=POSTS.map(p=>[p[0],p[1],p[2].replace("{N}",S.stage>=2&&!after(3)?`お名前は、${esc(nm())}様。`:"")]);
  if(after(3)) ps.unshift([todayDot,"ただいま戻りました","長いあいだ休んでしまい、申し訳ありませんでした。今日から復帰します。<br>メゾン白萩の建物図面は、訂正しました。2階の「壁」の部分は、ただの壁です。<br>それから――大家の白萩さんが三年前に亡くなっていたことを、今日、はじめて知りました。"]);
  return head("STAFF BLOG","スタッフブログ")+`<section style="padding-top:18px"><div class="inner" style="max-width:760px">${ps.map(p=>`<div class="post"><time>${p[0]}</time><h3>${p[1]}</h3><p>${p[2]}</p><div class="by">担当：佐野</div></div>`).join("")}</div></section>`;
}
function vCompany(){
  return head("COMPANY","会社概要")+`<section style="padding-top:18px"><div class="inner"><table class="dtable"><tr><th>会社名</th><td>みどり台ハウジング株式会社</td></tr><tr><th>創業</th><td>1986年</td></tr><tr><th>事業内容</th><td>賃貸仲介・売買仲介・賃貸管理</td></tr><tr><th>管理物件</th><td>みどり台市内 約120棟（メゾン白萩ほか）</td></tr></table>
  <h3 class="sub">スタッフ</h3><div class="staff"><div><b>緑川 誠</b>代表取締役</div><div><b>岡本 由紀</b>賃貸営業</div><div><b>佐野 悠人</b>賃貸営業・ブログ担当　${after(3)?"":"<span style='color:var(--muted)'>（休職中）</span>"}</div></div></div></section>`;
}
function vFaq(){
  let f=[["内見の予約は必要ですか？","はい。「内見予約」ページからお申し込みください。お名前は、のちほど大切になります。"],
   ["204号室はありますか？","メゾン白萩の2階に、204号室はございません（欠番）。","建物図面の寸法を、画面を横にして全体でご覧ください。27.0mから、各部屋と階段の幅を引くと……。物件ページのアドレス（URL）の末尾もご覧ください。"]];
  f.push(["204号室のページに「掲載しておりません」と出ます","大家さんは、夜に来れば見せられると。","お使いの端末を「ダークモード」にしてください（0時〜5時は、そのままで）。"]);
  if(S.stage>=1) f.push(["押入れの写真が暗くて見えません","写真の明るさは、長押しで補正できます。","押入れの写真を、明るくなるまで長押ししてください。"]);
  if(S.stage>=2) f.push(["壁を叩いても返事がありません","回数が、決まっているようです。","押入れの壁に書いてあった回数だけ、壁をすばやくタップしてください。"]);
  if(S.stage>=3) f.push(["204号室の中に入れません","この部屋は、電波が届きません。","端末を「機内モード」にしてください（パソコンの方はネットワークを切断）。"]);
  if(S.stage>=4) f.push(["契約書の借主は、誰の名前を書けばいいですか？","押入れの壁に、答えがありました。","「かしぬしを　かりぬしに」。貸主の名前は、物件概要に。"]);
  if(S.ends.length) f.push(["結末はひとつですか？","三つございます。"]);
  return head("FAQ","よくある質問")+`<section style="padding-top:8px"><div class="inner" style="max-width:820px">${f.map(x=>`<div class="q">${x[0]}</div><div class="a">${x[1]}${x[2]?`<details class="h2"><summary>さらにヒントを見る</summary>${x[2]}</details>`:""}</div>`).join("")}</div></section>`;
}
function vCredits(){
  const e=Object.entries(CREDITS);
  return head("PHOTO CREDITS","写真クレジット")+`<section style="padding-top:18px"><div class="inner"><ul class="news">${e.map(([k,c])=>`<li style="grid-template-columns:1fr"><span style="font-size:13px">${c.artist}／${c.license}<br><a style="color:var(--main2);word-break:break-all" href="${c.page}">${c.file}</a></span></li>`).join("")}</ul><p class="note" style="margin-top:10px">掲載写真は Wikimedia Commons の自由ライセンス画像です。本サイトは架空の不動産会社を舞台にした謎解きゲームであり、実在の団体・物件とは関係ありません。</p></div></section>`;
}
function notFound(){return head("404","ページが見つかりません")+`<section style="padding-top:18px"><div class="inner"><p>お探しのページは見つかりませんでした。</p><a class="btn" href="#top" style="margin-top:14px">トップへ</a></div></section>`}

/* ===== ルーティング ===== */
const VIEWS={top:vTop,list:vList,reserve:vReserve,blog:vBlog,company:vCompany,faq:vFaq,credits:vCredits,inside:vInside};
let lastHash="";
function route(){
  const h=(location.hash||"#top").slice(1);
  document.body.classList.toggle("night",isNight());
  document.getElementById("ticker").textContent= after(3)?"メゾン白萩の建物図面を訂正しました": (after(1)||after(2))?"メゾン白萩 203号室は、ご成約となりました":isNight()?"ただいまの時間は、お電話での受付を終了しております":"メゾン白萩 203号室、家賃大幅値下げ！　即入居可";
  document.getElementById("gnav").innerHTML=PAGES.map(([k,v])=>`<a href="#${k}" class="${k===h?"on":""}">${v}</a>`).join("");
  document.getElementById("drawer").innerHTML=PAGES.map(([k,v])=>`<a href="#${k}">${v}</a>`).join("");
  document.getElementById("drawer").classList.remove("open");
  const m=h.match(/^bukken-(\d{3})$/);
  document.getElementById("main").innerHTML= h==="bukken-c102"? vCorpo() : m? vBukken(m[1]) : (VIEWS[h]||notFound)();
  if(lastHash!==h)window.scrollTo(0,0);lastHash=h;bind(h);
}
window.addEventListener("hashchange",route);
(mq.addEventListener?mq.addEventListener("change",route):mq.addListener(route));
document.getElementById("hamb").onclick=()=>document.getElementById("drawer").classList.toggle("open");
function bind(h){
  const rf=document.getElementById("rf");
  if(rf) rf.onsubmit=e=>{e.preventDefault();const v=document.getElementById("rname").value.trim();if(!v)return;S.name=v.slice(0,16);S.res="MS-203-"+pad(now.getMonth()+1)+pad(now.getDate());save();route()};
  if(h==="bukken-204") bind204();
  if(h==="inside") bindInside();
}

/* ===== 結末 ===== */
function endLines(id,x){
  const n=esc(nm());
  return {
   1:["押印すると、男が、ゆっくり振り向いた。","「……ありがとうございます」","気がつくと、男の姿はなかった。","壁の向こうから、こつ、こつ、と音がする。","となりの203号室に、新しい人が越してきたらしい。","あなたは、やさしく、壁を叩き返す。"],
   2:[`借主の欄に「${esc(x)}」と書き、押印した。`,"押入れの板が、外れる音がした。","あなたは、203号室の畳の上に立っていた。","……翌朝、みどり台ハウジングに、内見の予約が入った。",`お名前は、${esc(x)}様。`],
   3:["借主の欄に「白萩 トメ」と書き、押印した。","部屋の灯りが、ふっと消えた。","廊下のほうで、ほうきの音がして――止まった。","佐野が、はじめて振り向いた。「……出られる」","気がつくと、ふたりはメゾン白萩の前に立っていた。","2階の窓は、四つ。数えなおしても、四つだった。"]
  }[id];
}
function ending(id,x){
  if(!S.ends.includes(id))S.ends.push(id);S.stage=9;S.last=id;save();
  const lines=[...endLines(id,x),`<span class="en" style="font-size:13px;color:#9fc7b0">${id===3?"TRUE END":"END "+id}　―　${END_T[id]}</span>`,`<small style="font-size:12px;color:#7a8a80">結末 ${S.ends.length} / 3</small>`];
  const d=document.createElement("div");d.id="end";
  if(id===3)d.style.background="linear-gradient(#0a0f0c,#1d2a24 60%,#56604f)";
  d.innerHTML=lines.map(l=>`<p>${l}</p>`).join("")+`<div><button id="eb1">トップへ戻る</button><button id="eb2">もう一度、204号室へ</button></div>`;
  document.body.appendChild(d);
  const ps=d.querySelectorAll("p");ps.forEach((p,i)=>setTimeout(()=>p.classList.add("v"),700+i*1500));
  setTimeout(()=>d.querySelectorAll("button").forEach(b=>b.style.opacity=1),700+ps.length*1500);
  d.querySelector("#eb1").onclick=()=>{d.remove();location.hash="#top";route()};
  d.querySelector("#eb2").onclick=()=>{d.remove();S.stage=3;S.last=0;save();if(location.hash==="#inside")route();else location.hash="#inside"};
}
document.getElementById("reset").onclick=function(){
  if(this.dataset.c){try{localStorage.removeItem(KEY)}catch(e){}S={stage:0,name:"",res:"",ends:[],last:0};this.dataset.c="";this.textContent="データを初期化";location.hash="#top";route()}
  else{this.dataset.c=1;this.textContent="本当に初期化する？（もう一度押す）"}
};
route();
</script>
